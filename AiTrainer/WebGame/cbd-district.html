<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trainer - CBD District Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #05070d;
        }

        body {
            display: grid;
            place-items: center;
            font-family: "Press Start 2P", monospace;
        }

        canvas {
            display: block;
            width: min(100vw, 1280px);
            height: auto;
            max-height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #08111f;
        }
    </style>
</head>
<body>
    <canvas id="cbdCanvas" width="1280" height="720"></canvas>
    <script src="cbd-district.js"></script>
    <script>
        const canvas = document.getElementById('cbdCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        window.gameState = { scene: window.CBDDistrict.SCENE_NAME };

        function loadImage(path) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = reject;
                image.src = path;
            });
        }

        async function bootCBDDistrict() {
            window.CBDDistrict.init(canvas, ctx);
            await window.CBDDistrict.loadAssets(loadImage);

            function frame() {
                window.CBDDistrict.draw();
                requestAnimationFrame(frame);
            }

            frame();
        }

        bootCBDDistrict().catch((error) => {
            console.error('CBD District failed to load:', error);
        });
    </script>
</body>
</html>
